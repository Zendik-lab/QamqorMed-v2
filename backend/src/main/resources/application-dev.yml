spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/qamqormed}
    username: ${DB_USERNAME:qamqormed}
    password: ${DB_PASSWORD:dev_password_change_me}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.qamqormed: INFO
