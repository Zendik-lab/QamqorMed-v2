spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: existing-qamqormed-schema
    validate-on-migrate: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  ai:
    enabled: ${AI_ENABLED:false}
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    basic-auth-username: ${OLLAMA_BASIC_AUTH_USERNAME:}
    basic-auth-password: ${OLLAMA_BASIC_AUTH_PASSWORD:}
    model: ${OLLAMA_MODEL:qwen3:8b}
    num-ctx: ${OLLAMA_NUM_CTX:4096}
    request-timeout: ${AI_REQUEST_TIMEOUT:45s}
    max-message-length: ${AI_MAX_MESSAGE_LENGTH:4000}
    max-history-messages: ${AI_MAX_HISTORY_MESSAGES:12}
    max-concurrent-requests: ${AI_MAX_CONCURRENT_REQUESTS:2}
    max-requests-per-minute: ${AI_MAX_REQUESTS_PER_MINUTE:20}
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION}

logging:
  level:
    com.qamqormed: INFO
server:
  port: ${PORT:8080}
  address: 0.0.0.0
